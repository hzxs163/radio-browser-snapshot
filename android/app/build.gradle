plugins {
    id 'com.android.application'
}

// 版本号由 -Pdiantai.version=0.1 传入；versionCode 用 主*10000+次*100+修订，
// 保证覆盖安装只认这个数字且严格递增。
def vName = providers.gradleProperty('diantai.version').getOrElse('0.1')
def nums = vName.split(/[^0-9]+/).findAll { it }.collect { it as int }
while (nums.size() < 3) nums << 0
def vCode = nums[0] * 10000 + nums[1] * 100 + nums[2]

android {
    namespace 'com.hzxs163.diantai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hzxs163.diantai'
        // 24 = Android 7.0：MediaPlayer / MediaSession / Notification.MediaStyle 都够用
        minSdk 24
        targetSdk 35
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        // 仓库内置固定密钥：换签名会让老用户覆盖安装失败（INSTALL_FAILED_UPDATE_INCOMPLETE）。
        // 这把钥匙只签本 app，不用于任何其他发布物。
        release {
            storeFile file('../keystore/diantai.p12')
            storePassword 'diantai-android'
            storeType 'PKCS12'
            keyAlias 'diantai'
            keyPassword 'diantai-android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
