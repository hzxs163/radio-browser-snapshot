name: daily-snapshot

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      page:
        description: '每页拉取条数（官方上限 5000）'
        required: false
        default: '2000'
      include_jsonl:
        description: '同时提交 stations.jsonl.gz（原始逐条 JSON，体积更大）'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取 Radio Browser 官方数据
        run: |
          set -euo pipefail
          node scripts/fetch.js --page='${{ inputs.page || '2000' }}' --out=build/data

      - name: 按选项丢弃 jsonl
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_jsonl != true }}
        run: rm -f build/data/stations.jsonl.gz

      - name: 生成前端数据集（播放器直接读这三件产物）
        run: |
          set -euo pipefail
          node scripts/test-web-data.cjs
          node scripts/build-web.mjs --in=build/data/stations.csv.gz --out=build/data/stations.web.json.gz

      - name: 校验产物
        run: |
          set -euo pipefail
          test -s build/data/stations.csv.gz
          test -s build/data/stations.web.json.gz
          test -s build/data/stations.ids.json.gz
          test -s build/data/meta.json
          test -s build/data/meta_web.json
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("build/data/meta.json", "utf8"));
            const w = JSON.parse(fs.readFileSync("build/data/meta_web.json", "utf8"));
            // 前端数据集只收可播的台，量级骤降说明上游字段变了或分页断了
            if (w.web_rows < 40000) throw new Error("web_rows 异常低: " + w.web_rows);
            if (w.web_rows > m.rows_lastcheckok_1) throw new Error("web_rows 超过 lastcheckok=1 行数");
            if (w.web_rows + w.dropped_not_playable !== w.csv_rows) throw new Error("行数不守恒");
            console.log("rows=" + m.rows_written + " web_rows=" + w.web_rows
              + " web_gz=" + w.gz_bytes + " sha256=" + w.sha256_gz);
          '

      - name: 强制更新 data 分支（只保留 1 个提交，仓库体积不随天数增长）
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/datawk"
          git init -q "$RUNNER_TEMP/datawk"
          cd "$RUNNER_TEMP/datawk"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git symbolic-ref HEAD refs/heads/data
          cp -r "$GITHUB_WORKSPACE/build/data/." "$PWD/"
          rows=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("meta.json","utf8")).rows_written)')
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git add -A
          git commit -q -m "snapshot $date — $rows stations (Radio Browser official API)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git" HEAD:data
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 把摘要写成提交评论（匿名也能在网页上看到结果）
        if: ${{ always() && env.head_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let meta = {};
            let web = {};
            try { meta = JSON.parse(fs.readFileSync('build/data/meta.json', 'utf8')); } catch (e) {}
            try { web = JSON.parse(fs.readFileSync('build/data/meta_web.json', 'utf8')); } catch (e) {}
            const body = [
              '## Radio Browser 快照 ' + (meta.fetched_at || '拉取失败'),
              '',
              '| 字段 | 值 |',
              '| --- | --- |',
              '| 写入行数 | ' + (meta.rows_written ?? '失败') + ' |',
              '| 官方 stats | 可用 ' + (meta.stats_stations_ok ?? '?') + ' + 失效 ' + (meta.stats_stations_broken ?? '?') + ' = 推算全量 ' + (meta.expected_total_rows ?? '?') + ' |',
              '| 实际 lastcheckok 分布 | =1: ' + (meta.rows_lastcheckok_1 ?? '?') + ' / ≠1: ' + (meta.rows_lastcheckok_0 ?? '?') + ' |',
              '| 前端数据集 | 可播 ' + (web.web_rows ?? '-') + ' 条（剔除 ' + (web.dropped_not_playable ?? '-') + '）· ' + (web.gz_bytes ?? '-') + ' B gz / ' + (web.uncompressed_bytes ?? '-') + ' B 未压缩 · sha256 `' + (web.sha256_gz ?? '-') + '` |',
              '| 电台 id 表 | ' + (web.ids_rows ?? '-') + ' 条 · ' + (web.ids_gz_bytes ?? '-') + ' B gz · sha256 `' + (web.ids_sha256_gz ?? '-') + '` |',
              '| 来源 | ' + (meta.source ?? '-') + ' |',
              '| API 版本 | ' + (meta.api_software_version ?? '-') + ' |',
              '| stations.csv.gz sha256 | `' + (meta.sha256_csv_gz ?? '-') + '` |',
              '| CSV 未压缩 | ' + (meta.csv_uncompressed_bytes ?? '-') + ' B |',
              '',
              'data 分支提交 `' + (process.env.head_sha || '') + '`',
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: process.env.head_sha, body,
            });

      - name: 失败时也留一条评论
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try { tail = fs.readFileSync('build/data/meta.json', 'utf8'); } catch (e) {}
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'daily-snapshot 运行失败（' + new Date().toISOString() + '）。'
                  + 'data 分支未改动，仍是上一次快照。请到 Actions 查看具体报错。'
                  + (tail ? '\n\n```\n' + tail.slice(0, 800) + '\n```' : ''),
            });
