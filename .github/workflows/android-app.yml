name: android-app

# 只在 app-v* 标签或手动触发时发版；main 上的每次推送只构建产物，用来发现编译错误。
# 注意：on.push 同时写 branches 和 tags 会把标签推送静默过滤掉（踩过），所以这里不设过滤。
on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.1'
        required: false
        default: '0.1'
      publish:
        description: '构建后是否发布 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 定版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/app-v* ]]; then
            v="${GITHUB_REF#refs/tags/app-v}"
          else
            v="0.0.${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "版本号格式不对：$v" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "构建版本：$v"

      - name: 刷新内置快照（失败就沿用仓库里那份）
        run: |
          set -euo pipefail
          base=https://hzxs163.github.io/radio-browser-snapshot
          dst=android/app/src/main/assets
          if curl -fsSL --max-time 90 -o "$dst/stations.meta.json.tmp" "$base/meta_web.json" \
             && curl -fsSL --max-time 180 -o "$dst/stations.web.dat.tmp" "$base/stations.web.json.gz"; then
            mv "$dst/stations.meta.json.tmp" "$dst/stations.meta.json"
            mv "$dst/stations.web.dat.tmp" "$dst/stations.web.dat"
            echo "已更新为线上最新快照"
          else
            rm -f "$dst"/*.tmp
            echo "拉取失败，沿用仓库内置的那份快照"
          fi
          ls -l "$dst"
          sha256sum "$dst/stations.web.dat"
          python3 - <<'PY'
          import json, hashlib
          meta = json.load(open('android/app/src/main/assets/stations.meta.json'))
          raw = open('android/app/src/main/assets/stations.web.dat','rb').read()
          got = hashlib.sha256(raw).hexdigest()
          print('meta sha256_gz =', meta.get('sha256_gz'))
          print('asset sha256    =', got)
          assert meta.get('sha256_gz') == got, '内置快照与 meta 的 sha256 不一致'
          assert meta.get('web_rows', 0) > 0, 'meta 里 web_rows 无效'
          print('内置快照校验通过，行数', meta['web_rows'])
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 构建 release APK
        run: gradle -p android assembleRelease --no-daemon -Pdiantai.version=${{ steps.ver.outputs.version }}

      - name: 校验并重命名 APK
        id: pack
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          src=android/app/build/outputs/apk/release/app-release.apk
          out="电台APP v${v}.apk"
          cp "$src" "$out"
          test -s "$out"
          ls -l "$out"
          # 用 python 读 zip：不受 shell locale / unzip 版本影响，失败时还能把条目打全
          python3 - "$out" <<'PY'
          import sys, zipfile
          p = sys.argv[1]
          z = zipfile.ZipFile(p)
          names = z.namelist()
          print('entries:', len(names))
          for n in names:
              if n.startswith('assets/'):
                  print('  asset:', n, z.getinfo(n).file_size)
          for want in ('assets/stations.web.dat', 'assets/stations.meta.json'):
              assert want in names, 'APK 里缺少 ' + want
          print('assets ok')
          PY
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$out" > certs.txt
          cat certs.txt | sed -n '1,5p'
          grep -q 'CN=DiantaI' certs.txt
          echo "size=$(stat -c %s "$out")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "asset=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: diantai-${{ steps.ver.outputs.version }}
          path: 电台APP*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          tag="app-v${v}"
          asset="${{ steps.pack.outputs.asset }}"
          sha="${{ steps.pack.outputs.sha256 }}"
          size="${{ steps.pack.outputs.size }}"
          cat > notes.md <<EOF
          中文电台优先、内置电台目录的安卓收听 App。v${v} 是第一个可用版本。

          - 打开就是中文台（大陆 + 港澳台 + 标注中文/粤语的台），也可以切「全部」看全球 6 万多台
          - 电台目录内置在安装包里，装完断网也能列出电台
          - 后台无感更新：开屏时比对线上快照的 sha256，只有变了才下新版（约 2.1 MB），校验后原子替换，下次开屏就用新的
          - 播放走前台服务，锁屏/切后台继续出声，通知栏和锁屏都能暂停、停止
          - 收藏存在本地，长按列表右侧的星星即可

          安装：下载下面的 apk，打开并允许「安装未知来源应用」。以后覆盖安装即可（同一把签名钥匙，收藏和本机快照都留着）。

          文件：$asset · $size 字节
          SHA-256：$sha
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "电台APP v${v}" --notes-file notes.md
          else
            gh release create "$tag" "$asset" --title "电台APP v${v}" --notes-file notes.md
          fi
          gh release view "$tag" --json url -q '.url'
